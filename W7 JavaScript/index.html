<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-libreria — Settimana VII Giorno I</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <header class="site-header">
    <h1>La mia libreria</h1>
    <p>Aggiungi i tuoi libri e segnali come letti.</p>
  </header>

  <main class="container">

    <section class="form-section">
      <h2>Aggiungi un libro</h2>
      <form id="aggiungi-libro" class="form">
        <div class="campo">
          <label for="titolo">Titolo</label>
          <input type="text" id="titolo" name="titolo">
        </div>

        <div class="campo">
          <label for="autore">Autore</label>
          <input type="text" id="autore" name="autore">
        </div>

        <div class="campo">
          <label for="anno">Anno</label>
          <input type="number" id="anno" name="anno">
        </div>

        <div class="campo">
          <label for="formato">Formato</label>
          <select id="formato" name="formato">
            <option value="cartaceo">Cartaceo</option>
            <option value="digitale">Digitale</option>
          </select>
        </div>

        <div class="campo campo-condizionale" id="campo-dimensione" hidden>
          <label for="dimensioneMb">Dimensione MB</label>
          <input type="number" id="dimensioneMb" name="dimensioneMb" step="0.1">
        </div>

        <button type="submit" class="btn-primary">Aggiungi</button>
      </form>

      </form>
    </section>

    <section class="lista-section">
      <h2>I tuoi libri</h2>
      <ul id="lista-libri">
        <!-- popolato da JavaScript -->
      </ul>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
    crossorigin="anonymous"></script>
  <script src="assets/js/script.js"></script>
</body>

</html>
