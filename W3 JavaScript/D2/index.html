<!doctype html>
<html lang="it">

<head>
	<meta charset="UTF-8" />
	<title>Task Manager</title>
	<link rel="stylesheet" href="style.css" />
</head>

<body>
	<h1 id="titolo">I miei task</h1>

	<div class="aggiunta">
		<div>
			<p style="text-align: center;">Priorità:</p>
			<select name="motivoDelContatto" id="motivoDelContatto">
				<option value=""></option>
				<option value="alta">Alta</option>
				<option value="media">Media</option>
				<option value="bassa">Bassa</option>
			</select>
		</div>
		<input id="nuovo-task" placeholder="Cosa devi fare?" />
		<button id="bottone-aggiungi">Aggiungi</button>
	</div>

	<ul id="lista-task"></ul>

	<p>Totale: <span id="contatore">0</span></p>

	<script src="script.js"></script>
</body>

</html>
