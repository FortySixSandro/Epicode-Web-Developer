<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>



<body>
    <header class="bg-primary text-white py-3">

        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="fs-3 m-0">EpiShop</h1>
            <nav>
                <a class="text-white text-decoration-none mx-3" href="">Prodotti</a>
                <a class="text-white text-decoration-none mx-3" href="">Offerte</a>
                <a class="text-white text-decoration-none mx-3 d-none d-md-inline" href="">Contatti</a>
            </nav>
        </div>

    </header>

    <section class="hero bg-light py-5">
        <div class="container text-center">
            <h2 class="fs-1 fw-bold mb-3">Saldi di primavera</h2>
            <p class="fs-5 text-muted mb-4">Scopri le offerte sui prodotti in evidenza, fino al 50% di sconto.</p>
            <button type="button" class="btn btn-primary">Vedi i prodotti</button>
        </div>
    </section>

    <main class="container my-4">
        <div class="row">
            <aside class="col-lg-3 d-none d-lg-block">
                <div class="bg-light p-3 rounded border">
                    <h3 class="fs-5 fw-bold mb-3">Categorie</h3>
                    <p class="m-0 mb-2">Scarpe</p>
                    <p class="m-0 mb-2">T-shirt</p>
                    <p class="m-0 mb-2">Borse</p>
                    <p class="m-0 mb-2">Accessori</p>
                </div>
            </aside>


            <section class="col-12 col-lg-9">
                <h2 class="fs-3 fw-bold mb-4 text-center text-md-start">Prodotti in evidenza</h2>
                <div class="row">
                    <article class="col-12 col-md-6 col-xl-4 mb-3">
                        <div class="border rounded p-3 bg-white shadow-sm">
                            <div class="bg-secondary mb-2 rounded" style="height: 160px;">
                            </div>
                            <h3 class="fs-5 fw-bold m-0">Sneaker Run</h3>
                            <p class="text-muted m-0">€89,00</p>
                        </div>
                    </article>
                    <article class="col-12 col-md-6 col-xl-4 mb-3">
                        <div class="border rounded p-3 bg-white shadow-sm">
                            <div class="bg-secondary mb-2 rounded" style="height: 160px;">
                            </div>
                            <h3 class="fs-5 fw-bold m-0">T-shirt basic</h3>
                            <p class="text-muted m-0">€19,00</p>
                        </div>
                    </article>
                    <article class="col-12 col-md-6 col-xl-4 mb-3">
                        <div class="border rounded p-3 bg-white shadow-sm">
                            <div class="bg-secondary mb-2 rounded" style="height: 160px;">
                            </div>
                            <h3 class="fs-5 fw-bold m-0">Borsa city</h3>
                            <p class="text-muted m-0">€49,00</p>
                        </div>
                    </article>
                </div>
            </section>
        </div>
    </main>


    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="m-0">&copy; 2026 EpiShop - tutti i diritti riservati.</p>
        </div>
    </footer>

</body>

</html>
